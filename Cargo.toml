[package]
name = "poshgre"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["poshgre contributors"]
description = "A TUI PostgreSQL client for fast database exploration with fuzzy search"
license = "MIT"
repository = "https://github.com/hatohato25/poshgre"
homepage = "https://hatohato25.github.io/poshgre/"
keywords = ["postgresql", "tui", "database", "bastion", "cli"]
categories = ["command-line-utilities", "database"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# fzf integration
skim = "0.10"

# Configuration
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Security (credential memory protection)
zeroize = { version = "1", features = ["derive"] }

# Unicode display width
unicode-width = "0.2"

# Clipboard access (Ctrl+V paste support)
arboard = "3"

# Path expansion
shellexpand = "3"

# SSH tunneling (bastion support)
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

# Claude API (AI prompt feature)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.10"
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["postgres"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "posh"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
